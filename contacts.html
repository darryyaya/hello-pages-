<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>hello-pages- — Контакты</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <nav class="nav">
            <a href="index.html" class="nav__logo">🚀 hello-pages-</a>
            <ul class="nav__list">
                <li><a href="index.html" class="nav__link">Главная</a></li>
                <li><a href="about.html" class="nav__link">О нас</a></li>
                <li><a href="projects.html" class="nav__link">Проекты</a></li>
                <li><a href="contacts.html" class="nav__link nav__link--active">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="section">
            <h2 class="section__title">Свяжитесь с нами</h2>
            <p class="section__subtitle">Ответим в течение дня. Форма — демо.</p>

            <form id="contact-form" class="form">
                <label>Имя
                    <input type="text" placeholder="Как к вам обращаться?" required>
                </label>
                <label>Email
                    <input type="email" placeholder="you@example.com" required>
                </label>
                <label>Сообщение
                    <textarea rows="5" placeholder="Расскажите, что вас интересует..." required></textarea>
                </label>
                <button type="submit" class="btn btn--primary">Отправить</button>
            </form>
            <p id="form-message" style="margin-top:1rem;"></p>
        </section>
    </main>

    <footer class="site-footer"><p>© 2026 Команда hello-pages-</p></footer>
    <script src="js/main.js"></script>
</body>
</html>
